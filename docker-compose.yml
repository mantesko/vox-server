services:
  vox-server:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: vox-server
    network_mode: host
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=Systran/faster-whisper-small
      - COMPUTE_TYPE=int8
      - WHISPER_DEVICE=cpu
      - FINAL_BEAM=5
      - FINAL_BEST_OF=1
      - FINAL_PATIENCE=1.0
      - FINAL_TEMPERATURE=0.0,0.2
      - FINAL_REPETITION_PENALTY=1.2
      - FINAL_NO_REPEAT_NGRAM_SIZE=3
      - FINAL_NO_SPEECH_THRESHOLD=0.6
      - FINAL_CHUNK_LENGTH=15
      - FINAL_CONDITION_ON_PREVIOUS_TEXT=false
      - VAD_THRESHOLD=0.4
      - VAD_MIN_SILENCE_MS=300
      - INITIAL_PROMPT=Це розпізнавання мовлення українською мовою. Привіт, як справи? Добре, дякую. Сьогодні гарний день для роботи. Напишіть код, запустіть сервер, перевірте тести.
      - API_KEY=${VOX_API_KEY:-}
      - CPU_THREADS=3
    volumes:
      - ./models:/app/models
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 3G
