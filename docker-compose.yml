version: '3.8'

services:
  vox-server:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: vox-server
    network_mode: host
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=Systran/faster-whisper-small
      - COMPUTE_TYPE=int8
      - WHISPER_DEVICE=cpu
      - FINAL_BEAM=10
      - FINAL_BEST_OF=1
      - FINAL_PATIENCE=2.5
      - FINAL_TEMPERATURE=0.0
      - FINAL_REPETITION_PENALTY=1.2
      - FINAL_NO_SPEECH_THRESHOLD=0.5
      - FINAL_CONDITION_ON_PREVIOUS_TEXT=true
      - API_KEY=${VOX_API_KEY:-}
      - CPU_THREADS=4
    volumes:
      - ./models:/app/models
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 3G
